<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - Madaklasht Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0f172a;--header:#111827;--panel:#1e293b;--banner:#263449;--red:#ef4444;--muted:#cbd5e1;--dim:#94a3b8;--green:#22c55e}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding-bottom:174px;background:var(--navy);color:#fff;font-family:'Poppins',sans-serif}header{position:sticky;top:0;z-index:1000;padding:18px;background:var(--header);box-shadow:0 2px 10px rgba(0,0,0,.3);text-align:center}header h1{font-size:1.7rem}.red{color:var(--red)}main{max-width:500px;margin:auto;padding:15px 15px 24px}.wishlist-title-card{display:flex;margin:0 0 12px;padding:11px 12px;border-radius:14px;background:var(--panel);box-shadow:0 5px 16px rgba(0,0,0,.18);align-items:center;gap:10px}.wishlist-title-card h2{font-size:.92rem}.back-arrow{display:grid;width:32px;height:32px;flex:0 0 32px;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;place-items:center;font-size:1.05rem}.mode-banner{margin-bottom:16px;padding:17px;border-left:4px solid var(--red);border-radius:16px;background:var(--banner);box-shadow:0 5px 20px rgba(0,0,0,.22)}.mode-banner h2{font-size:1rem;line-height:1.55}.wishlist-items-card{padding:12px;border-radius:19px;background:var(--header);box-shadow:0 5px 18px rgba(0,0,0,.18)}.wishlist-items-heading{margin:2px 2px 12px;font-size:.92rem}.select-row{display:flex;margin-bottom:12px;align-items:center;justify-content:space-between}.select-all-btn{padding:8px 11px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:var(--panel);color:var(--muted);cursor:pointer;font:600 .72rem 'Poppins',sans-serif}.select-all-btn.active{border-color:rgba(239,68,68,.65);background:rgba(239,68,68,.16);color:#fca5a5}.product-select{width:18px;height:18px;accent-color:var(--red);cursor:pointer}.selected-label{color:var(--dim);font-size:.72rem}.wishlist-list{display:grid;gap:11px}.wish-card{display:grid;grid-template-columns:22px 76px minmax(0,1fr);gap:10px;padding:11px;border-radius:17px;background:var(--panel);box-shadow:0 5px 18px rgba(0,0,0,.2);animation:fadeIn .3s ease}.wish-card .product-select{margin-top:5px}.wish-image{width:76px;height:76px;border-radius:12px;background:#334155;object-fit:cover}.wish-info{position:relative;min-width:0;padding-right:18px}.wish-name{overflow:hidden;font-size:.84rem;font-weight:600;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.wish-desc{overflow:hidden;margin-top:3px;color:var(--muted);font-size:.67rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}.wish-price{margin-top:4px;color:var(--green);font-size:.8rem;font-weight:600}.wish-store{margin-top:2px;color:#fbbf24;font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remove-btn{position:absolute;top:0;right:0;width:22px;height:22px;border:0;border-radius:7px;background:transparent;color:#fca5a5;cursor:pointer;font-size:15px}.qty-row{display:flex;gap:8px;margin-top:7px;align-items:center}.qty-btn{display:grid;width:25px;height:25px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:var(--navy);color:#fff;cursor:pointer;place-items:center;font-size:15px}.qty-value{min-width:18px;text-align:center;font-size:.75rem;font-weight:600}.order-bar{position:fixed;right:10px;bottom:80px;left:10px;z-index:900;padding:11px 13px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(30,41,59,.98);box-shadow:0 8px 24px rgba(0,0,0,.35)}.order-summary{display:flex;max-width:480px;margin:auto;align-items:center;justify-content:space-between}.order-summary small{display:block;color:var(--dim);font-size:.63rem}.order-summary strong{color:var(--green);font-size:.92rem}.order-button{width:auto;margin:0;padding:11px 15px;border:0;border-radius:11px;background:var(--red);color:#fff;cursor:pointer;font:600 .76rem 'Poppins',sans-serif}.order-button:disabled{opacity:.48;cursor:not-allowed}.empty-state,.login-state{padding:40px 18px;border-radius:18px;background:var(--panel);color:var(--dim);text-align:center}.empty-icon{display:block;margin-bottom:9px;font-size:2.4rem}.empty-state strong,.login-state strong{display:block;margin-bottom:5px;color:#fff;font-size:.94rem}.empty-state p,.login-state p{font-size:.78rem;line-height:1.55}.primary-link{display:inline-block;margin-top:15px;padding:10px 16px;border-radius:11px;background:var(--red);color:#fff;font-size:.78rem;font-weight:600;text-decoration:none}.skeleton-card{display:grid;grid-template-columns:22px 76px 1fr;gap:10px;padding:11px;border-radius:17px;background:var(--panel);overflow:hidden}.shimmer{background:linear-gradient(90deg,#334155 0%,#475569 50%,#334155 100%);background-size:200% 100%;animation:shimmer 1.25s infinite linear}.skeleton-check{width:18px;height:18px;margin-top:5px;border-radius:5px}.skeleton-image{width:76px;height:76px;border-radius:12px}.skeleton-lines{padding:4px 0}.skeleton-line{height:9px;margin-bottom:9px;border-radius:999px}.skeleton-line.short{width:55%}.skeleton-line.medium{width:75%}.bottom-nav{position:fixed;bottom:0;left:0;z-index:1000;display:flex;width:100%;height:72px;align-items:center;justify-content:space-around;border-top:1px solid var(--panel);background:var(--header)}.bottom-nav a{display:flex;color:var(--dim);text-decoration:none;align-items:center;flex-direction:column;font-size:12px}.bottom-nav a span{margin-bottom:4px;font-size:22px}.bottom-nav a.active{color:var(--red)}#toast{position:fixed;top:20px;left:50%;z-index:3000;max-width:calc(100% - 32px);padding:13px 18px;border-radius:13px;background:var(--header);box-shadow:0 5px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateX(-50%);transition:.3s;font-size:.8rem}.toast-show{top:38px!important;opacity:1!important}.toast-success{border-left:4px solid var(--green)}.toast-error{border-left:4px solid var(--red)}@keyframes shimmer{100%{background-position:-200% 0}}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <header><h1><span class="red">Madaklasht</span> Store</h1></header>
  <main>
    <section class="wishlist-title-card"><a class="back-arrow" href="account.html" aria-label="Back to account">←</a><h2>Your Wishlist</h2></section>
    <section class="mode-banner"><h2>Your wishlist is waiting for you — choose your favorites and order them when you're ready. ❤️</h2></section>
    <section id="wishlistContent" class="wishlist-items-card"><h3 class="wishlist-items-heading">Wishlist Items</h3><div id="selectionRow" class="select-row" hidden><button id="selectAll" class="select-all-btn" type="button">Select All</button><span id="selectedLabel" class="selected-label">0 items selected</span></div><div id="wishlistList" class="wishlist-list"></div></section>
  </main>
  <div id="orderBar" class="order-bar" hidden><div class="order-summary"><div><small id="orderCount">0 items selected · 0 quantity</small><strong id="orderTotal">Total: Rs. 0</strong></div><button id="orderButton" class="order-button" disabled>Buy Now</button></div></div>
  <nav class="bottom-nav"><a href="index.html"><span>🏠</span><p>Home</p></a><a href="products.html"><span>🛍️</span><p>Shop</p></a><a href="news.html"><span>📰</span><p>News</p></a><a href="tourism.html"><span>🗺️</span><p>Tourism</p></a><a href="account.html" class="active"><span>👤</span><p>Account</p></a></nav><div id="toast"></div>
  <script>
    /* Wishlist backend actions: getWishlist and removeWishlistItem.
       They belong to the existing Account API and must use the logged-in email. */
    const ACCOUNT_API="https://script.google.com/macros/s/AKfycbzRoJjmCgy--dsVAz8_TXu4CxiXiGGQ0GKTE6ufxN2Ctq8BceL1djQfp4N8vg65Jg0SaA/exec";
    const PLACEHOLDER_IMAGE="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='76' height='76'><rect width='100%' height='100%' fill='#334155'/><text x='50%' y='50%' fill='#94a3b8' font-size='10' text-anchor='middle' dominant-baseline='middle'>No Image</text></svg>");
    let wishlist=[], selectedIds=new Set();
    const userEmail=localStorage.getItem("userEmail");
    function isLoggedIn(){return localStorage.getItem("isLoggedIn")==="true"&&!!userEmail}
    function clean(value){return String(value||"").trim()}
    function escapeHTML(value){return clean(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function idOf(item){return clean(item.ProductID||item.productId||item.id)}
    function nameOf(item){return clean(item.ProductName||item.productName||item.name)||"Product"}
    function imageOf(item){return clean(item.ImageURL||item.imageURL||item.image)||PLACEHOLDER_IMAGE}
    function priceOf(item){const value=Number(String(item.Price??item.price??0).replace(/[^0-9.]/g,""));return Number.isFinite(value)?value:0}
    function descriptionOf(item){return clean(item.Description||item.description)}
    function storeOf(item){return clean(item.StoreName||item.storeName)||"Madaklasht Store"}
    function qtyOf(item){const qty=Number(item.Quantity??item.qty??1);return Number.isInteger(qty)&&qty>0?qty:1}
    function showToast(message,type){const toast=document.getElementById("toast");toast.textContent=message;toast.className="toast-show toast-"+(type||"success");setTimeout(()=>toast.className="",2600)}
    function skeletons(){return `<div class="skeleton-card"><span class="skeleton-check shimmer"></span><span class="skeleton-image shimmer"></span><div class="skeleton-lines"><div class="skeleton-line shimmer medium"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line shimmer short"></div></div></div><div class="skeleton-card"><span class="skeleton-check shimmer"></span><span class="skeleton-image shimmer"></span><div class="skeleton-lines"><div class="skeleton-line shimmer medium"></div><div class="skeleton-line shimmer"></div><div class="skeleton-line shimmer short"></div></div></div>`}
    function render(){const list=document.getElementById("wishlistList"),row=document.getElementById("selectionRow"),bar=document.getElementById("orderBar");if(!wishlist.length){row.hidden=true;bar.hidden=true;list.innerHTML=`<div class="empty-state"><span class="empty-icon">❤️</span><strong>Your wishlist is waiting for you</strong><p>Save products you love and they'll appear here when you're ready to order.</p><a class="primary-link" href="product.html">Explore Products</a></div>`;return}row.hidden=false;bar.hidden=false;list.innerHTML=wishlist.map(item=>{const id=escapeHTML(idOf(item)),selected=selectedIds.has(idOf(item));return `<article class="wish-card"><input class="product-select" type="checkbox" ${selected?"checked":""} onchange="toggleSelect('${id}')"><img class="wish-image" src="${escapeHTML(imageOf(item))}" alt="${escapeHTML(nameOf(item))}" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}'"><div class="wish-info"><button class="remove-btn" aria-label="Remove ${escapeHTML(nameOf(item))}" onclick="removeItem('${id}')">×</button><p class="wish-name">${escapeHTML(nameOf(item))}</p>${descriptionOf(item)?`<p class="wish-desc">${escapeHTML(descriptionOf(item))}</p>`:""}<p class="wish-price">Rs. ${priceOf(item)}</p><p class="wish-store">🏪 ${escapeHTML(storeOf(item))}</p><div class="qty-row"><button class="qty-btn" onclick="changeQty('${id}',-1)">−</button><span class="qty-value">${qtyOf(item)}</span><button class="qty-btn" onclick="changeQty('${id}',1)">+</button></div></div></article>`}).join("");updateSummary()}
    function updateSummary(){const selected=wishlist.filter(item=>selectedIds.has(idOf(item))),quantity=selected.reduce((sum,item)=>sum+qtyOf(item),0),total=selected.reduce((sum,item)=>sum+priceOf(item)*qtyOf(item),0),all=wishlist.length>0&&selected.length===wishlist.length;document.getElementById("selectedLabel").textContent=selected.length+" item"+(selected.length===1?"":"s")+" selected";document.getElementById("orderCount").textContent=selected.length+" items selected · "+quantity+" quantity";document.getElementById("orderTotal").textContent="Total: Rs. "+total;document.getElementById("orderButton").disabled=!selected.length;const selectButton=document.getElementById("selectAll");selectButton.textContent=all?"✓ All Selected":"Select All";selectButton.classList.toggle("active",all)}
    function toggleSelect(id){selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);render()}
    function changeQty(id,delta){const item=wishlist.find(entry=>idOf(entry)===id);if(!item)return;item.Quantity=Math.max(1,qtyOf(item)+delta);render()}
    async function removeItem(id){const item=wishlist.find(entry=>idOf(entry)===id);if(!item)return;try{const response=await fetch(ACCOUNT_API,{method:"POST",body:JSON.stringify({action:"removeWishlistItem",email:userEmail,CustomerEmail:userEmail,ProductID:id})}),data=await response.json();if(data.status!=="success"&&data.success!==true)throw new Error(data.message||data.error||"Unable to remove item");wishlist=wishlist.filter(entry=>idOf(entry)!==id);selectedIds.delete(id);render();showToast("Removed from wishlist ❤️","success")}catch(error){showToast(error.message||"Unable to remove from wishlist.","error")}}
    function orderSelected(){const items=wishlist.filter(item=>selectedIds.has(idOf(item))).map(item=>({ProductID:idOf(item),ProductName:nameOf(item),Price:priceOf(item),ImageURL:imageOf(item),Quantity:qtyOf(item),StoreName:storeOf(item),SellerID:clean(item.SellerID||item.sellerId),SellerEmail:clean(item.SellerEmail||item.sellerEmail)}));if(!items.length){showToast("Please select at least one product.","error");return}try{sessionStorage.setItem("buyNowItems",JSON.stringify(items));sessionStorage.setItem("checkoutSource","wishlist");window.location.href="checkout.html"}catch(_){showToast("Unable to start checkout.","error")}}
    function showLoginState(){document.getElementById("wishlistContent").innerHTML=`<div class="login-state"><span class="empty-icon">🔐</span><strong>Login to view your wishlist</strong><p>Sign in to see and manage the products you have saved.</p><a class="primary-link" href="account.html">Go to Account</a></div>`}
    async function loadWishlist(){if(!isLoggedIn()){showLoginState();return}document.getElementById("wishlistList").innerHTML=skeletons();try{const response=await fetch(ACCOUNT_API,{method:"POST",body:JSON.stringify({action:"getWishlist",email:userEmail,CustomerEmail:userEmail})}),data=await response.json();if(data.status!=="success"&&data.success!==true)throw new Error(data.message||data.error||"Unable to load wishlist");wishlist=Array.isArray(data.wishlist)?data.wishlist:Array.isArray(data.items)?data.items:[];wishlist=wishlist.map(item=>Object.assign({},item,{Quantity:qtyOf(item)}));render()}catch(error){wishlist=[];document.getElementById("selectionRow").hidden=true;document.getElementById("orderBar").hidden=true;document.getElementById("wishlistList").innerHTML=`<div class="empty-state"><span class="empty-icon">⚠</span><strong>Unable to load wishlist</strong><p>Please try again in a moment.</p></div>`;showToast(error.message||"Unable to load wishlist.","error")}}
    document.getElementById("selectAll").addEventListener("click",()=>{const all=wishlist.length>0&&selectedIds.size===wishlist.length;selectedIds=all?new Set():new Set(wishlist.map(idOf));render()});document.getElementById("orderButton").addEventListener("click",orderSelected);window.onload=loadWishlist;
  </script>
</body>
</html>
