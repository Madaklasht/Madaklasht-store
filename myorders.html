<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Madaklasht Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0f172a; --header:#111827; --panel:#1e293b; --banner:#263449; --red:#ef4444; --muted:#cbd5e1; --dim:#94a3b8; --green:#22c55e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; padding-bottom:90px; background:var(--navy); color:#fff; font-family:'Poppins',sans-serif; }
    header { position:sticky; top:0; z-index:1000; padding:18px; background:var(--header); box-shadow:0 2px 10px rgba(0,0,0,.3); text-align:center; }
    header h1 { font-size:1.7rem; }.red { color:var(--red); }
    main { max-width:500px; margin:auto; padding:18px 15px 26px; }
    .thank-you-card { display:flex; width:100%; margin:2px 0 16px; padding:15px; border:0; border-radius:16px; background:var(--panel); box-shadow:0 5px 18px rgba(0,0,0,.2); color:var(--muted); cursor:pointer; align-items:center; gap:12px; font-family:'Poppins',sans-serif; text-align:left; }.back-arrow { display:grid; width:34px; height:34px; flex:0 0 34px; border-radius:10px; background:var(--navy); color:#fff; place-items:center; font-size:1.1rem; }.thank-you-card strong { display:block; color:#fff; font-size:.84rem; line-height:1.3; }.thank-you-card .thank-you-subtitle { display:block; margin-top:3px; color:var(--muted); font-size:.7rem; line-height:1.4; }
    .mode-banner { margin-bottom:18px; padding:17px; border-left:4px solid var(--red); border-radius:16px; background:var(--banner); box-shadow:0 5px 20px rgba(0,0,0,.22); }.mode-banner h3 { margin-bottom:4px; font-size:1rem; }.mode-banner p { color:var(--muted); font-size:.8rem; line-height:1.55; }
    .section-heading { margin:0 0 10px; font-size:.96rem; }.status-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 0 18px; }.summary-stat { position:relative; min-height:76px; padding:11px 6px; border-radius:13px; background:var(--panel); overflow:hidden; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,.16); }.summary-stat strong { display:block; margin-bottom:5px; font-size:1.2rem; }.summary-stat small { color:var(--dim); font-size:.65rem; }.summary-processing strong { color:#facc15; }.summary-delivered strong { color:var(--green); }.summary-cancelled strong { color:#f87171; }.is-loading::after { position:absolute; top:0; left:-120%; width:80%; height:100%; content:""; background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent); animation:shimmer 1.25s infinite; }.tracker-list { display:none; }
    .track-card { padding:12px; border-radius:16px; background:var(--panel); box-shadow:0 5px 16px rgba(0,0,0,.2); }.track-top { display:flex; gap:10px; align-items:center; margin-bottom:12px; }.track-top strong { min-width:0; overflow:hidden; font-size:.8rem; text-overflow:ellipsis; white-space:nowrap; }.track-top span { margin-left:auto; color:var(--dim); font-size:.68rem; white-space:nowrap; }
    .track-progress { display:flex; align-items:flex-start; }.track-stage { position:relative; z-index:1; display:flex; min-width:0; flex:1; flex-direction:column; align-items:center; text-align:center; }.track-dot { display:grid; width:20px; height:20px; border-radius:50%; background:#475569; color:#fff; place-items:center; font-size:10px; }.track-dot.done { background:var(--green); }.track-dot.active { background:var(--red); box-shadow:0 0 0 4px rgba(239,68,68,.18); }.track-line { height:2px; flex:1; margin-top:9px; background:#475569; }.track-line.done { background:var(--green); }.track-stage small { margin-top:6px; color:#64748b; font-size:8px; line-height:1.15; }.track-stage.done small { color:#86efac; }.track-stage.active small { color:#f87171; }.cancel-track { display:flex; align-items:center; gap:8px; color:#f87171; font-size:.78rem; }
    .category-card { margin-top:2px; padding:10px; border-radius:19px; background:var(--header); box-shadow:0 5px 18px rgba(0,0,0,.18); }.tab-control { display:flex; gap:8px; margin:0 0 12px; padding:7px; border-radius:16px; background:var(--navy); }.tab-button { width:50%; margin:0; padding:11px 7px; border:0; border-radius:11px; background:transparent; color:var(--dim); cursor:pointer; font:600 .86rem 'Poppins',sans-serif; transition:.2s ease; }.tab-button.active { background:var(--red); color:#fff; }.tab-panel[hidden] { display:none; }
    .order-list { display:grid; gap:12px; }.order-card { padding:12px; border-radius:18px; background:var(--panel); box-shadow:0 5px 18px rgba(0,0,0,.22); animation:fadeIn .3s ease; }.order-main { display:flex; gap:12px; align-items:flex-start; }.product-image { width:80px; height:80px; flex:0 0 80px; border-radius:13px; background:#334155; object-fit:cover; }.order-info { min-width:0; flex:1; }.order-name { overflow:hidden; font-size:.9rem; font-weight:600; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }.order-detail { margin-top:4px; color:var(--muted); font-size:.72rem; }.order-total { margin-top:5px; color:var(--green); font-size:.78rem; font-weight:600; }.order-foot { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:11px; }.status-badge { display:inline-flex; padding:5px 9px; border-radius:999px; font-size:.67rem; font-weight:600; white-space:nowrap; }.status-processing { background:rgba(250,204,21,.14); color:#facc15; }.status-way { background:rgba(96,165,250,.14); color:#60a5fa; }.status-delivered { background:rgba(34,197,94,.14); color:var(--green); }.status-cancelled { background:rgba(239,68,68,.14); color:#f87171; }.mini-button { width:auto; margin:0; padding:7px 10px; border:1px solid rgba(239,68,68,.65); border-radius:9px; background:transparent; color:#fca5a5; cursor:pointer; font:600 .68rem 'Poppins',sans-serif; }.mini-button:hover { background:rgba(239,68,68,.12); }.details-button { border-color:rgba(255,255,255,.15); color:var(--muted); }
    .skeleton-card { display:flex; gap:12px; padding:12px; border-radius:18px; background:var(--panel); overflow:hidden; }.skeleton-image, .skeleton-line { background:linear-gradient(90deg,#334155 0%,#475569 50%,#334155 100%); background-size:200% 100%; animation:shimmer 1.25s infinite linear; }.skeleton-image { width:80px; height:80px; flex:0 0 80px; border-radius:13px; }.skeleton-copy { flex:1; padding:4px 0; }.skeleton-line { height:10px; margin-bottom:10px; border-radius:999px; }.skeleton-line.short { width:55%; }.skeleton-line.medium { width:76%; }
    .rating-card .order-main { align-items:center; }.rating-meta { margin-top:4px; color:#86efac; font-size:.72rem; }.rating-action { width:auto; margin:10px 0 0 92px; padding:9px 12px; border:0; border-radius:10px; background:var(--red); color:#fff; cursor:pointer; font:600 .75rem 'Poppins',sans-serif; }.rating-action.rated { background:rgba(34,197,94,.14); color:#86efac; cursor:default; }.rated-stars { margin:6px 0 0 92px; color:#fbbf24; font-size:1rem; }
    .empty-state { padding:38px 18px; border-radius:18px; background:var(--panel); color:var(--dim); text-align:center; }.empty-icon { display:block; margin-bottom:9px; font-size:2.3rem; }.empty-state strong { display:block; margin-bottom:5px; color:#fff; font-size:.94rem; }.empty-state p { font-size:.78rem; line-height:1.55; }.shop-button { display:inline-block; margin-top:15px; padding:10px 16px; border-radius:11px; background:var(--red); color:#fff; font-size:.78rem; font-weight:600; text-decoration:none; }
    .modal-overlay { position:fixed; inset:0; z-index:2000; display:flex; padding:20px; align-items:center; justify-content:center; background:rgba(2,6,23,.75); opacity:0; pointer-events:none; transition:opacity .2s ease; }.modal-overlay.show { opacity:1; pointer-events:auto; }.modal { width:100%; max-width:360px; padding:20px; border-radius:20px; background:var(--panel); box-shadow:0 20px 50px rgba(0,0,0,.5); transform:translateY(12px) scale(.97); transition:transform .2s ease; }.modal-overlay.show .modal { transform:translateY(0) scale(1); }.modal h3 { margin-bottom:7px; font-size:1.1rem; }.modal > p { color:var(--muted); font-size:.8rem; line-height:1.55; }.modal-actions { display:flex; gap:9px; margin-top:18px; }.modal-actions button { flex:1; margin:0; padding:11px; border:0; border-radius:11px; cursor:pointer; font:600 .78rem 'Poppins',sans-serif; }.keep-button { background:#334155; color:#fff; }.cancel-button { background:var(--red); color:#fff; }.rating-product { display:flex; gap:11px; align-items:center; margin:15px 0; }.rating-product img { width:58px; height:58px; border-radius:12px; object-fit:cover; }.rating-product strong { font-size:.84rem; }.star-picker { display:flex; justify-content:center; gap:4px; margin:12px 0 15px; }.star { width:42px; padding:0; border:0; background:transparent; color:#64748b; cursor:pointer; font-size:2rem; line-height:1; }.star.selected { color:#fbbf24; }.review-input { width:100%; min-height:82px; padding:11px; border:1px solid rgba(255,255,255,.1); border-radius:12px; resize:vertical; outline:0; background:var(--navy); color:#fff; font:inherit; font-size:.78rem; }.submit-rating { width:100%; margin-top:12px; padding:12px; border:0; border-radius:12px; background:var(--red); color:#fff; cursor:pointer; font:600 .82rem 'Poppins',sans-serif; }.submit-rating:disabled { cursor:not-allowed; opacity:.45; }
    #toast { position:fixed; top:20px; left:50%; z-index:3000; max-width:calc(100% - 32px); padding:13px 18px; border-radius:13px; background:var(--header); box-shadow:0 5px 20px rgba(0,0,0,.35); opacity:0; pointer-events:none; transform:translateX(-50%); transition:.3s; font-size:.8rem; }.toast-show { top:38px !important; opacity:1 !important; }.toast-success { border-left:4px solid var(--green); }.toast-error { border-left:4px solid var(--red); }
    .bottom-nav { position:fixed; bottom:0; left:0; z-index:1000; display:flex; width:100%; height:72px; align-items:center; justify-content:space-around; border-top:1px solid var(--panel); background:var(--header); }.bottom-nav a { display:flex; color:var(--dim); text-decoration:none; align-items:center; flex-direction:column; font-size:12px; }.bottom-nav a span { margin-bottom:4px; font-size:22px; }.bottom-nav a.active { color:var(--red); } @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } } @keyframes shimmer { 100% { left:140%; } }
  </style>
</head>
<body>
  <header><h1><span class="red">Madaklasht</span> Store</h1></header>
  <main>
    <button class="thank-you-card" type="button" onclick="window.location.href='account.html'" aria-label="Back to account"><span class="back-arrow">←</span><span><strong>Thank you for shopping with us</strong><span class="thank-you-subtitle">Manage your purchases in one place.</span></span></button>
    <section class="mode-banner"><h3>My Orders</h3><p>Track your purchases, manage active orders, and rate products after delivery.</p></section>
    <section><h3 class="section-heading">Track Your Order</h3><div class="status-summary"><div class="summary-stat summary-processing is-loading"><strong id="processingCount">0</strong><small>Processing</small></div><div class="summary-stat summary-delivered is-loading"><strong id="deliveredCount">0</strong><small>Delivered</small></div><div class="summary-stat summary-cancelled is-loading"><strong id="cancelledCount">0</strong><small>Cancelled</small></div></div></section>
    <section class="category-card"><div class="tab-control" role="tablist" aria-label="Order categories"><button class="tab-button active" data-tab="products" role="tab" aria-selected="true">🛍️ Products</button><button class="tab-button" data-tab="ratings" role="tab" aria-selected="false">⭐ Ratings</button></div><section id="productsPanel" class="tab-panel"><div id="productsList" class="order-list"></div></section><section id="ratingsPanel" class="tab-panel" hidden><div id="ratingsList" class="order-list"></div></section></section>
  </main>
  <nav class="bottom-nav"><a href="index.html"><span>🏠</span><p>Home</p></a><a href="products.html"><span>🛍️</span><p>Shop</p></a><a href="news.html"><span>📰</span><p>News</p></a><a href="tourism.html"><span>🗺️</span><p>Tourism</p></a><a href="account.html" class="active"><span>👤</span><p>Account</p></a></nav>
  <div id="cancelModal" class="modal-overlay"><div class="modal"><h3>Cancel Order?</h3><p>Are you sure you want to cancel this order?</p><div class="modal-actions"><button class="keep-button" onclick="closeModal('cancelModal')">Keep Order</button><button class="cancel-button" onclick="confirmCancelOrder()">Yes, Cancel</button></div></div></div>
  <div id="ratingModal" class="modal-overlay"><div class="modal"><h3>Rate Product</h3><div class="rating-product"><img id="ratingImage" alt=""><strong id="ratingName"></strong></div><div id="starPicker" class="star-picker" aria-label="Choose a rating"></div><textarea id="reviewText" class="review-input" maxlength="800" placeholder="Write a review... (optional)"></textarea><button id="submitRatingButton" class="submit-rating" disabled onclick="submitRating()">Submit Rating</button><button class="keep-button" style="width:100%;margin-top:9px;padding:11px;border:0;border-radius:11px;cursor:pointer;font:600 .78rem 'Poppins',sans-serif" onclick="closeModal('ratingModal')">Cancel</button></div></div>
  <div id="toast"></div>
  <script>
    const API = "https://script.google.com/macros/s/AKfycbzWmBxTn30d2dZoPIdfC0VE9cL-Mt6UtEn8eUTVuJJFMx-1vnh7NmfJsJO2_q0YIc0ZRA/exec";
    const PLACEHOLDER_IMAGE = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='100%' height='100%' fill='#334155'/><text x='50%' y='50%' fill='#94a3b8' font-size='11' text-anchor='middle' dominant-baseline='middle'>No Image</text></svg>");
    let orders = [], ratings = [], activeOrder = null, selectedStars = 0, isLoading = false;

    function valueOf(item, keys) { for (const key of keys) { if (item && item[key] !== undefined && item[key] !== null && String(item[key]).trim() !== "") return item[key]; } return ""; }
    function clean(value) { return String(value || "").trim(); }
    function escapeHTML(value) { return clean(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }
    function orderId(order) { return clean(valueOf(order, ["OrderID", "orderId", "id", "ID"])); }
    function productId(order) { return clean(valueOf(order, ["ProductID", "productId", "product_id"])); }
    function productName(order) { return clean(valueOf(order, ["ProductName", "productName", "Product", "product", "name"])) || "Product"; }
    function productImage(order) { return clean(valueOf(order, ["ImageURL", "imageURL", "Image", "image", "ProductImage", "productImage"])) || PLACEHOLDER_IMAGE; }
    function quantity(order) { const value = Number(valueOf(order, ["Qty", "qty", "Quantity", "quantity"]) || 1); return Number.isFinite(value) && value > 0 ? value : 1; }
    function price(order) { const raw = valueOf(order, ["Price", "price", "UnitPrice", "unitPrice"]); const value = Number(String(raw || 0).replace(/[^0-9.]/g, "")); return Number.isFinite(value) ? value : 0; }
    function total(order) { const raw = valueOf(order, ["TotalPrice", "totalPrice", "Total", "total"]); const value = Number(String(raw || "").replace(/[^0-9.]/g, "")); return Number.isFinite(value) && raw !== "" ? value : price(order) * quantity(order); }
    function normalizeStatus(status) { const value = clean(status).toLowerCase().replaceAll("_", " "); if (["on the way", "ontheway", "shipped", "out for delivery"].includes(value)) return "On The Way"; if (value === "delivered") return "Delivered"; if (["cancelled", "canceled"].includes(value)) return "Cancelled"; return "Processing"; }
    function statusOf(order) { return normalizeStatus(valueOf(order, ["Status", "status", "OrderStatus", "orderStatus"])); }
    function dateOf(order) { const raw = clean(valueOf(order, ["Date", "date", "CreatedAt", "createdAt", "OrderDate", "orderDate"])); return raw ? raw.replace("T", " ").slice(0, 10) : "—"; }
    function storeOf(order) { return clean(valueOf(order, ["StoreName", "storeName", "SellerStore"])) || "Madaklasht Store"; }
    function sellerId(order) { return clean(valueOf(order, ["SellerID", "sellerId"])); }
    function ratingKey(order) { return orderId(order) + "::" + productId(order); }
    function existingRating(order) { return ratings.find(r => clean(valueOf(r, ["OrderID", "orderId"])) === orderId(order) && clean(valueOf(r, ["ProductID", "productId"])) === productId(order)); }
    function showToast(message, type) { const toast = document.getElementById("toast"); toast.textContent = message; toast.className = "toast-show toast-" + (type || "error"); setTimeout(() => { toast.className = ""; }, 2800); }
    function openModal(id) { document.getElementById(id).classList.add("show"); }
    function closeModal(id) { document.getElementById(id).classList.remove("show"); }
    function requireLogin() { showToast("⚠ Please login to view orders", "error"); setTimeout(() => { window.location.href = "account.html"; }, 1000); }
    function post(action, payload) { return fetch(API, { method:"POST", body:JSON.stringify(Object.assign({ action:action }, payload)) }).then(res => res.json()); }

    function statusBadge(status) { const type = status === "Processing" ? "processing" : status === "On The Way" ? "way" : status === "Delivered" ? "delivered" : "cancelled"; const icon = status === "Processing" ? "🟠" : status === "On The Way" ? "🔵" : status === "Delivered" ? "🟢" : "🔴"; return `<span class="status-badge status-${type}">${icon} ${status}</span>`; }
    function skeletonCards() { return `<div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-copy"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div><div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-copy"><div class="skeleton-line medium"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>`; }
    function renderProducts() { const box = document.getElementById("productsList"); if (isLoading) { box.innerHTML = skeletonCards(); return; } if (!orders.length) { box.innerHTML = `<div class="empty-state"><span class="empty-icon">📦</span><strong>No orders yet</strong><p>Your purchases will appear here.</p><a class="shop-button" href="products.html">Shop Now</a></div>`; return; } box.innerHTML = orders.map(order => { const status = statusOf(order); return `<article class="order-card"><div class="order-main"><img class="product-image" src="${escapeHTML(productImage(order))}" alt="${escapeHTML(productName(order))}" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}'"><div class="order-info"><p class="order-name">${escapeHTML(productName(order))}</p><p class="order-detail">Qty: ${quantity(order)} · Rs. ${price(order)} each</p><p class="order-total">Total: Rs. ${total(order)}</p><p class="order-detail">${escapeHTML(storeOf(order))} · ${escapeHTML(dateOf(order))}</p></div></div><div class="order-foot">${statusBadge(status)}<span><button class="mini-button details-button" onclick="showDetails('${escapeHTML(ratingKey(order))}')">View Details</button>${status === "Processing" ? `<button class="mini-button" onclick="askCancel('${escapeHTML(ratingKey(order))}')">Cancel Order</button>` : ""}</span></div></article>`; }).join(""); }
    function renderRatings() { const box = document.getElementById("ratingsList"); if (isLoading) { box.innerHTML = skeletonCards(); return; } const delivered = orders.filter(order => statusOf(order) === "Delivered"); if (!delivered.length) { box.innerHTML = `<div class="empty-state"><span class="empty-icon">⭐</span><strong>No products ready for rating yet.</strong><p>Delivered products will appear here when they are ready for your feedback.</p></div>`; return; } box.innerHTML = delivered.map(order => { const rated = existingRating(order); const stars = rated ? Math.max(0, Math.min(5, Number(valueOf(rated, ["Stars", "stars"]) || 0))) : 0; return `<article class="order-card rating-card"><div class="order-main"><img class="product-image" src="${escapeHTML(productImage(order))}" alt="${escapeHTML(productName(order))}" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}'"><div class="order-info"><p class="order-name">${escapeHTML(productName(order))}</p><p class="rating-meta">Delivered ✓</p><p class="order-detail">${escapeHTML(storeOf(order))}</p></div></div>${rated ? `<p class="rated-stars">${"★".repeat(stars)}${"☆".repeat(5 - stars)}</p><button class="rating-action rated">✓ Rated</button>` : `<button class="rating-action" onclick="openRating('${escapeHTML(ratingKey(order))}')">Rate Product</button>`}</article>`; }).join(""); }
    function updateStatusSummary() { document.getElementById("processingCount").textContent = orders.filter(order => statusOf(order) === "Processing").length; document.getElementById("deliveredCount").textContent = orders.filter(order => statusOf(order) === "Delivered").length; document.getElementById("cancelledCount").textContent = orders.filter(order => statusOf(order) === "Cancelled").length; document.querySelectorAll(".summary-stat").forEach(card => card.classList.remove("is-loading")); }
    function renderAll() { updateStatusSummary(); renderProducts(); renderRatings(); }
    function findOrder(key) { return orders.find(order => ratingKey(order) === key); }
    function askCancel(key) { activeOrder = findOrder(key); if (activeOrder) openModal("cancelModal"); }
    async function confirmCancelOrder() { if (!activeOrder) return; const button = document.querySelector("#cancelModal .cancel-button"); button.disabled = true; button.textContent = "Cancelling..."; try { const data = await post("cancelOrder", { OrderID:orderId(activeOrder), orderId:orderId(activeOrder), email:localStorage.getItem("userEmail") }); if (data.status === "success" || data.success === true) { activeOrder.Status = "Cancelled"; closeModal("cancelModal"); renderAll(); showToast("Order cancelled successfully", "success"); } else showToast(data.message || data.error || "Unable to cancel this order", "error"); } catch (_) { showToast("Unable to cancel this order", "error"); } finally { button.disabled = false; button.textContent = "Yes, Cancel"; } }
    function openRating(key) { activeOrder = findOrder(key); if (!activeOrder) return; selectedStars = 0; document.getElementById("ratingImage").src = productImage(activeOrder); document.getElementById("ratingImage").onerror = function() { this.src = PLACEHOLDER_IMAGE; }; document.getElementById("ratingName").textContent = productName(activeOrder); document.getElementById("reviewText").value = ""; renderStarPicker(); openModal("ratingModal"); }
    function renderStarPicker() { const picker = document.getElementById("starPicker"); picker.innerHTML = [1,2,3,4,5].map(number => `<button class="star ${number <= selectedStars ? "selected" : ""}" type="button" aria-label="${number} stars" onclick="selectStars(${number})">${number <= selectedStars ? "★" : "☆"}</button>`).join(""); document.getElementById("submitRatingButton").disabled = selectedStars < 1; }
    function selectStars(number) { selectedStars = number; renderStarPicker(); }
    async function submitRating() { if (!activeOrder || selectedStars < 1) return; const button = document.getElementById("submitRatingButton"); button.disabled = true; button.textContent = "Submitting..."; try { const data = await post("submitRating", { OrderID:orderId(activeOrder), ProductID:productId(activeOrder), SellerID:sellerId(activeOrder), CustomerEmail:localStorage.getItem("userEmail"), Stars:selectedStars, Review:document.getElementById("reviewText").value.trim() }); if (data.status === "success" || data.success === true) { ratings.push(data.rating || { OrderID:orderId(activeOrder), ProductID:productId(activeOrder), Stars:selectedStars }); closeModal("ratingModal"); renderRatings(); showToast(`You rated this product ${selectedStars}/5`, "success"); } else showToast(data.message || data.error || "Unable to submit rating", "error"); } catch (_) { showToast("Unable to submit rating", "error"); } finally { button.disabled = false; button.textContent = "Submit Rating"; } }
    function showDetails(key) { const order = findOrder(key); if (!order) return; showToast(`Order ${orderId(order) || "details"}: ${statusOf(order)}`, "success"); }
    function extractOrders(data) { const source = Array.isArray(data.orders) ? data.orders : Array.isArray(data.data) ? data.data : []; const result = []; source.forEach(order => { const items = order.Items || order.items || order.Products || order.products; if (Array.isArray(items)) items.forEach(item => result.push(Object.assign({}, order, item, { OrderID:orderId(order) }))); else result.push(order); }); return result; }
    async function loadOrders() { if (localStorage.getItem("isLoggedIn") !== "true" || !localStorage.getItem("userEmail")) return requireLogin(); const email = localStorage.getItem("userEmail"); isLoading = true; renderProducts(); renderRatings(); try { const data = await post("getUserOrders", { email:email, CustomerEmail:email }); if (data.status === "success" || data.success === true) { orders = extractOrders(data); ratings = Array.isArray(data.ratings) ? data.ratings : []; } else throw new Error("Orders unavailable"); } catch (_) { showToast("Unable to load orders. Please try again.", "error"); orders = []; } try { const ratingsData = await post("getCustomerRatings", { email:email, CustomerEmail:email }); if ((ratingsData.status === "success" || ratingsData.success === true) && Array.isArray(ratingsData.ratings)) ratings = ratingsData.ratings; } catch (_) { /* Backend can also include ratings in getUserOrders until this action is added. */ } isLoading = false; renderAll(); }
    document.querySelectorAll(".tab-button").forEach(button => button.addEventListener("click", function() { const products = this.dataset.tab === "products"; document.getElementById("productsPanel").hidden = !products; document.getElementById("ratingsPanel").hidden = products; document.querySelectorAll(".tab-button").forEach(tab => { const active = tab === this; tab.classList.toggle("active", active); tab.setAttribute("aria-selected", active); }); }));
    ["cancelModal", "ratingModal"].forEach(id => document.getElementById(id).addEventListener("click", event => { if (event.target.id === id) closeModal(id); }));
    window.onload = loadOrders;
  </script>
</body>
